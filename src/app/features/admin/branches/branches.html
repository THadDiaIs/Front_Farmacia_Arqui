<div class="p-6 bg-white dark:bg-slate-800 rounded-lg shadow-md m-4 border border-slate-200 dark:border-slate-700">
  <div class="flex justify-between items-center mb-6 border-b pb-4 border-slate-200 dark:border-slate-700">
    <h1 class="text-2xl font-semibold text-slate-800 dark:text-slate-100 tracking-tight">Branches Management</h1>
    <p-button label="Add Sucursal" icon="pi pi-plus" (onClick)="showDialogToAdd()" styleClass="p-button-success bg-emerald-600 hover:bg-emerald-700 border-none rounded-md px-4 py-2 text-white shadow-sm transition-colors duration-200"></p-button>
  </div>

  <p-table [value]="items" [paginator]="true" [rows]="10" styleClass="p-datatable-sm p-datatable-gridlines border border-slate-200 dark:border-slate-700 rounded overflow-hidden shadow-sm" [globalFilterFields]="['nombre']" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr class="bg-slate-50 dark:bg-slate-800/80 text-slate-700 dark:text-slate-200">
        <th pSortableColumn="id" class="font-medium py-3 px-4 text-left border-b border-slate-200 dark:border-slate-700">ID <p-sortIcon field="id"></p-sortIcon></th>
        <th pSortableColumn="nombre" class="font-medium py-3 px-4 text-left border-b border-slate-200 dark:border-slate-700">Name <p-sortIcon field="nombre"></p-sortIcon></th>
        <th pSortableColumn="direccion" class="font-medium py-3 px-4 text-left border-b border-slate-200 dark:border-slate-700">Address <p-sortIcon field="direccion"></p-sortIcon></th>
        <th pSortableColumn="telefono" class="font-medium py-3 px-4 text-left border-b border-slate-200 dark:border-slate-700">Phone <p-sortIcon field="telefono"></p-sortIcon></th>
        <th pSortableColumn="activo" class="font-medium py-3 px-4 text-left border-b border-slate-200 dark:border-slate-700">Status <p-sortIcon field="activo"></p-sortIcon></th>
        <th class="font-medium py-3 px-4 text-center border-b border-slate-200 dark:border-slate-700">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors duration-150 border-b border-slate-100 dark:border-slate-700">
        <td class="py-3 px-4 text-slate-600 dark:text-slate-300">{{item.id}}</td>
        <td class="py-3 px-4 text-slate-600 dark:text-slate-300">{{item.nombre}}</td>
        <td class="py-3 px-4 text-slate-600 dark:text-slate-300">{{item.direccion}}</td>
        <td class="py-3 px-4 text-slate-600 dark:text-slate-300">{{item.telefono || '-'}}</td>
        <td class="py-3 px-4 text-slate-600 dark:text-slate-300">
          <span [class]="item.activo ? 'px-2 py-1 bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 rounded-full text-xs font-medium' : 'px-2 py-1 bg-rose-50 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300 border border-rose-200 dark:border-rose-800 rounded-full text-xs font-medium'">
            {{item.activo ? 'Active' : 'Inactive'}}
          </span>
        </td>
        <td class="py-3 px-4 text-center space-x-2">
          <p-button icon="pi pi-pencil" (onClick)="showDialogToEdit(item)" styleClass="p-button-rounded p-button-text p-button-info text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950/50"></p-button>
          <p-button icon="pi pi-trash" (onClick)="delete(item)" styleClass="p-button-rounded p-button-text p-button-danger text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/50"></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog header="{{isEdit ? 'Edit Sucursal' : 'Add Sucursal'}}" [(visible)]="displayDialog" [modal]="true" [style]="{width: '450px'}" styleClass="rounded-lg shadow-xl overflow-hidden">
    <form [formGroup]="form" class="p-fluid grid grid-cols-1 gap-5 pt-4">
      <div class="field flex flex-col gap-2">
        <label for="nombre" class="text-sm font-medium text-slate-700 dark:text-slate-300">Name</label>
        <input pInputText id="nombre" formControlName="nombre" class="w-full border border-slate-300 dark:border-slate-700 rounded-md p-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none dark:bg-slate-900 dark:text-slate-100" />
      </div>
      <div class="field flex flex-col gap-2">
        <label for="direccion" class="text-sm font-medium text-slate-700 dark:text-slate-300">Address</label>
        <input pInputText id="direccion" formControlName="direccion" class="w-full border border-slate-300 dark:border-slate-700 rounded-md p-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none dark:bg-slate-900 dark:text-slate-100" />
      </div>
      <div class="field flex flex-col gap-2">
        <label for="telefono" class="text-sm font-medium text-slate-700 dark:text-slate-300">Phone</label>
        <input pInputText id="telefono" formControlName="telefono" class="w-full border border-slate-300 dark:border-slate-700 rounded-md p-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none dark:bg-slate-900 dark:text-slate-100" />
      </div>
      <div class="field flex items-center gap-2 mt-2">
        <p-checkbox id="activo" formControlName="activo" [binary]="true" inputId="activo"></p-checkbox>
        <label for="activo" class="text-sm font-medium text-slate-700 dark:text-slate-300 cursor-pointer">Active</label>
      </div>
    </form>
    <ng-template pTemplate="footer">
      <div class="flex justify-end gap-3 mt-6 border-t border-slate-200 dark:border-slate-700 pt-4">
        <p-button label="Cancel" icon="pi pi-times" (onClick)="displayDialog=false" styleClass="p-button-text text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 px-4 py-2 rounded"></p-button>
        <p-button label="Save" icon="pi pi-check" (onClick)="save()" [disabled]="form.invalid" styleClass="bg-indigo-600 hover:bg-indigo-700 text-white border-none px-4 py-2 rounded shadow-sm transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"></p-button>
      </div>
    </ng-template>
  </p-dialog>
</div>
