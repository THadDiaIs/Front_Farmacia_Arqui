<div class="flex items-center justify-center min-h-screen bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
  
  <div class="w-full max-w-md p-8 bg-white dark:bg-slate-800 rounded-[2rem] shadow-2xl shadow-indigo-950/5 dark:shadow-none border border-slate-200 dark:border-slate-700">
    
    <div class="flex items-center justify-center mb-8 gap-3">
      <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/30">
        <i class="pi pi-bolt text-white text-xl"></i>
      </div>
      <h1 class="text-3xl font-bold text-slate-900 dark:text-white tracking-tight">Finstack</h1>
    </div>

    <div class="text-center mb-8">
      <h2 class="text-2xl font-semibold text-slate-800 dark:text-slate-100 mb-2">Welcome Back</h2>
      <p class="text-slate-500 dark:text-slate-400 text-sm">Please enter your details to sign in.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
      
      <div class="flex flex-col gap-2">
        <label for="username" class="text-sm font-medium text-slate-700 dark:text-slate-200">Username</label>
        <div class="relative">
          <i class="pi pi-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 z-10"></i>
          <input pInputText id="username" formControlName="username" 
                 class="w-full pl-11 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all" 
                 placeholder="Enter your username" />
        </div>
      </div>
      
      <div class="flex flex-col gap-2">
        <label for="password" class="text-sm font-medium text-slate-700 dark:text-slate-200">Password</label>
        <div class="relative">
          <i class="pi pi-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 z-10"></i>
          <p-password id="password" formControlName="password" [feedback]="false" 
                      styleClass="w-full" 
                      [inputStyle]="{'padding-left': '2.75rem', 'padding-top': '0.75rem', 'padding-bottom': '0.75rem', 'border-radius': '0.75rem', 'background-color': 'var(--p-surface-50)', 'border-color': 'var(--p-surface-200)'}"
                      inputStyleClass="w-full dark:!bg-slate-900 dark:!border-slate-700 dark:!text-white outline-none focus:ring-2 focus:ring-indigo-500"
                      placeholder="••••••••"></p-password>
        </div>
      </div>

      <div class="flex items-center justify-between mt-1">
        <div class="flex items-center gap-2">
          <p-checkbox [binary]="true" inputId="remember"></p-checkbox>
          <label for="remember" class="text-sm text-slate-600 dark:text-slate-300 cursor-pointer">Remember me</label>
        </div>
        <a href="#" class="text-sm font-medium text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 transition-colors">Forgot password?</a>
      </div>

      <div *ngIf="error" class="p-3 bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 rounded-xl text-rose-600 dark:text-rose-400 text-sm flex items-center gap-2">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ error }}</span>
      </div>

      <button type="submit" 
              [disabled]="loginForm.invalid || loading"
              class="w-full mt-2 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/30 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <i class="pi pi-spin pi-spinner" *ngIf="loading"></i>
        <span>Sign In</span>
      </button>
      
    </form>
    
  </div>
</div>
