<!-- Global Notifications (Bottom-Center Position) -->
<p-toast position="bottom-center"></p-toast>

<!-- Auth Route (Login) -->
<ng-container *ngIf="isLoginPage">
  <router-outlet></router-outlet>
</ng-container>

<!-- Main App Layout -->
<div *ngIf="!isLoginPage" class="flex flex-col h-screen bg-slate-100 dark:bg-slate-900 font-sans transition-colors duration-200">
  <header class="h-20 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-4 lg:px-6 shrink-0 shadow-sm z-20 gap-4 transition-colors duration-200">
    <!-- Left: Time/Date -->
    <div class="flex flex-col items-center shrink-0">
       <span class="text-xl font-bold text-slate-800 dark:text-slate-100 tracking-tight">{{ currentTime | date:'HH:mm' }}</span>
       <span class="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-widest">{{ currentTime | date:'dd MMM yyyy' }}</span>
    </div>
    
    <!-- Center: Nav links (Responsive & Overflow protected) -->
    <nav class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto no-scrollbar py-1.5 px-1 max-w-full">
      <!-- POS / VENTAS -->
      <a *ngIf="hasVentasPermission" routerLink="/pos" routerLinkActive="!bg-indigo-50 !text-indigo-600 !border-indigo-200 dark:!bg-indigo-950/70 dark:!text-indigo-300 dark:!border-indigo-800 font-semibold shadow-sm" 
         class="shrink-0 whitespace-nowrap px-3.5 py-1.5 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-900/80 transition-all duration-200 flex flex-col items-center gap-1 border border-transparent hover:border-slate-200 dark:hover:border-slate-700 cursor-pointer select-none group">
         <i class="pi pi-desktop text-lg group-hover:scale-110 transition-transform duration-200"></i>
         <span class="text-xs">Punto de Venta</span>
      </a>
      <!-- Overview / DASHBOARD -->
      <a *ngIf="hasDashboardPermission" routerLink="/overview" routerLinkActive="!bg-indigo-50 !text-indigo-600 !border-indigo-200 dark:!bg-indigo-950/70 dark:!text-indigo-300 dark:!border-indigo-800 font-semibold shadow-sm" 
         class="shrink-0 whitespace-nowrap px-3.5 py-1.5 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-900/80 transition-all duration-200 flex flex-col items-center gap-1 border border-transparent hover:border-slate-200 dark:hover:border-slate-700 cursor-pointer select-none group">
         <i class="pi pi-chart-pie text-lg group-hover:scale-110 transition-transform duration-200"></i>
         <span class="text-xs">Rendimiento</span>
      </a>
      <!-- Analytics / GERENCIA -->
      <a *ngIf="hasGerenciaPermission" routerLink="/analytics" routerLinkActive="!bg-indigo-50 !text-indigo-600 !border-indigo-200 dark:!bg-indigo-950/70 dark:!text-indigo-300 dark:!border-indigo-800 font-semibold shadow-sm" 
         class="shrink-0 whitespace-nowrap px-3.5 py-1.5 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-900/80 transition-all duration-200 flex flex-col items-center gap-1 border border-transparent hover:border-slate-200 dark:hover:border-slate-700 cursor-pointer select-none group">
         <i class="pi pi-chart-line text-lg group-hover:scale-110 transition-transform duration-200"></i>
         <span class="text-xs">Analytics</span>
      </a>
      <!-- Arqueo / GERENCIA -->
      <a *ngIf="hasGerenciaPermission" routerLink="/shift-reconciliation" routerLinkActive="!bg-indigo-50 !text-indigo-600 !border-indigo-200 dark:!bg-indigo-950/70 dark:!text-indigo-300 dark:!border-indigo-800 font-semibold shadow-sm" 
         class="shrink-0 whitespace-nowrap px-3.5 py-1.5 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-900/80 transition-all duration-200 flex flex-col items-center gap-1 border border-transparent hover:border-slate-200 dark:hover:border-slate-700 cursor-pointer select-none group">
         <i class="pi pi-wallet text-lg group-hover:scale-110 transition-transform duration-200"></i>
         <span class="text-xs">Arqueo Caja</span>
      </a>
      <!-- Cashier / CAJA -->
      <a *ngIf="hasCajaPermission" routerLink="/cashier" routerLinkActive="!bg-indigo-50 !text-indigo-600 !border-indigo-200 dark:!bg-indigo-950/70 dark:!text-indigo-300 dark:!border-indigo-800 font-semibold shadow-sm" 
         class="shrink-0 whitespace-nowrap px-3.5 py-1.5 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-900/80 transition-all duration-200 flex flex-col items-center gap-1 border border-transparent hover:border-slate-200 dark:hover:border-slate-700 cursor-pointer select-none group">
         <i class="pi pi-inbox text-lg group-hover:scale-110 transition-transform duration-200"></i>
         <span class="text-xs">Caja</span>
      </a>

      <!-- Admin Dropdown Menu / ADMINISTRACION -->
      <div *ngIf="hasAdministracionPermission" class="shrink-0">
         <a (click)="adminMenu.toggle($event); $event.stopPropagation()" 
            [ngClass]="isAdminRoute ? '!bg-indigo-50 !text-indigo-600 !border-indigo-200 dark:!bg-indigo-950/70 dark:!text-indigo-300 dark:!border-indigo-800 font-semibold shadow-sm' : 'border-transparent hover:border-slate-200 dark:hover:border-slate-700'"
            class="whitespace-nowrap px-3.5 py-1.5 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-900/80 transition-all duration-200 flex flex-col items-center gap-1 border cursor-pointer select-none group">
            <i class="pi pi-cog text-lg group-hover:scale-110 transition-transform duration-200"></i>
            <span class="text-xs flex items-center gap-1">Administración <i class="pi pi-angle-down text-[10px] ml-0.5 mt-[1px]"></i></span>
         </a>
         <p-menu #adminMenu [model]="adminMenuItems" [popup]="true" [appendTo]="'body'"></p-menu>
      </div>

      <!-- Settings (Configuración) -->
      <a routerLink="/settings" routerLinkActive="!bg-indigo-50 !text-indigo-600 !border-indigo-200 dark:!bg-indigo-950/70 dark:!text-indigo-300 dark:!border-indigo-800 font-semibold shadow-sm" 
         class="shrink-0 whitespace-nowrap px-3.5 py-1.5 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-900/80 transition-all duration-200 flex flex-col items-center gap-1 border border-transparent hover:border-slate-200 dark:hover:border-slate-700 cursor-pointer select-none group">
         <i class="pi pi-cog text-lg group-hover:scale-110 transition-transform duration-200"></i>
         <span class="text-xs">Configuración</span>
      </a>
    </nav>
    
    <!-- Right: Avatar -->
    <div class="flex items-center gap-4 shrink-0">
      <div class="w-10 h-10 rounded-full bg-indigo-100 dark:bg-indigo-950/80 flex items-center justify-center text-indigo-700 dark:text-indigo-300 font-bold text-sm cursor-pointer hover:bg-indigo-200 dark:hover:bg-indigo-900 transition-colors border border-indigo-200 dark:border-indigo-800 select-none shadow-sm" (click)="profileMenu.toggle($event); $event.stopPropagation()">
        {{ userInitial }}
      </div>
      <p-menu #profileMenu [model]="menuItems" [popup]="true" [appendTo]="'body'"></p-menu>
    </div>
  </header>
  
  <main class="flex-1 overflow-auto w-full max-w-[1600px] mx-auto">
    <router-outlet></router-outlet>
  </main>
</div>
